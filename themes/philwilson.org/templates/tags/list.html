{% extends "base.html" %}

{% block title %}
<title>Tags - {{config.title}}</title>
{% endblock title %}

{% block content %}
  <h1 class="taxonomy-name">{{ taxonomy.name }}</h1>
  <div class="taxonomy-container">
    {% for term in terms %}
      {% if term.pages | length > 1 %}
        <div class="term">
        <a href="{{ term.permalink }}">{{ term.name }} ({{ term.pages | length }})</a>
        </div>
      {% endif %}
    {% endfor %}
  </div>
{% endblock content %}
